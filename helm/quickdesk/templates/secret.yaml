{{- if .Values.postgres.enabled }}
{{- $name := include "quickdesk.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.postgres.password }}
{{- if and (not $password) $existing }}
{{- /* upgrade: keep the password the database was created with */}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "quickdesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s-postgres:5432/%s" .Values.postgres.username $password (include "quickdesk.fullname" .) .Values.postgres.database | quote }}
{{- end }}
