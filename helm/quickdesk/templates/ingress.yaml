{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quickdesk.fullname" . }}
  labels:
    {{- include "quickdesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          # More specific path first: /api goes to the backend ...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "quickdesk.fullname" . }}-backend
                port:
                  name: http
          # ... everything else goes to the frontend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "quickdesk.fullname" . }}-frontend
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
