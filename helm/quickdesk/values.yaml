# Default values for the QuickDesk chart.
# Override on the command line, e.g.:
#   helm upgrade --install quickdesk helm/quickdesk -n quickdesk \
#     --set backend.image.tag=$GIT_SHA --set frontend.image.tag=$GIT_SHA

nameOverride: ""
fullnameOverride: ""

# Needed only if the GHCR packages are private, e.g. [{ name: ghcr-pull }]
imagePullSecrets: []

backend:
  replicaCount: 2 # ignored while autoscaling is enabled (HPA owns the count)
  image:
    repository: ghcr.io/YOUR_GITHUB_USERNAME/quickdesk-backend
    # CI tags images with the Git commit SHA. Set the real one at deploy time.
    tag: replace-with-git-sha
    pullPolicy: IfNotPresent
  port: 8000
  corsOrigins: "http://localhost:3000"
  enableDebugEndpoints: true # exposes /api/debug/burn for the autoscaling demo; set false for real use
  resources:
    # HPA's "60% CPU" is a percentage of this *request*. No request, no autoscaling.
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/YOUR_GITHUB_USERNAME/quickdesk-frontend
    tag: replace-with-git-sha
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  backendPort: 8000
  frontendPort: 80

ingress:
  enabled: true
  className: nginx
  # Leave empty to match any hostname (works with the load balancer address).
  # Or set e.g. quickdesk.local and add it to /etc/hosts.
  host: ""
  annotations: {}

postgres:
  enabled: true
  image: postgres:16-alpine
  database: quickdesk
  username: quickdesk
  # Leave empty: a random password is generated once and kept across upgrades.
  # Use only URL-safe characters if you set your own.
  password: ""
  persistence:
    enabled: true # false = emptyDir, data is lost when the pod restarts
    size: 2Gi
    storageClass: "" # "" = the cluster's default StorageClass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

metrics:
  serviceMonitor:
    # Only rendered when the Prometheus Operator CRDs exist (install monitoring first).
    enabled: true
    interval: 15s
    labels: {}
  grafanaDashboard:
    enabled: true # ConfigMap picked up by the Grafana sidecar
