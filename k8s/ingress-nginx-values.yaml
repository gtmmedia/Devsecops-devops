# Bootstrap: the ingress controller that turns Ingress objects into a real load balancer.
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     -n ingress-nginx --create-namespace -f k8s/ingress-nginx-values.yaml
controller:
  replicaCount: 1
  ingressClassResource:
    name: nginx
    default: true
  service:
    type: LoadBalancer
    annotations:
      # On AWS this creates a Network Load Balancer (instead of a Classic one).
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
